                    <label class="checkbox pure-checkbox" style="flex: 1;">
                        <input type="checkbox" id="chk-usetext" checked>
                        <span data-i18n="useText">套用文字</span>
                    </label>
                    <label class="checkbox pure-checkbox" style="flex: 1;">
                        <input type="checkbox" id="chk-play-video" checked>
                        <span data-i18n="playVideo">播放影片</span>
                    </label>
                </div>
                <div class="sidebar-row">
                    <div class="select-with-icon" style="flex:1;">
                        <i class="ti ti-layout-grid"></i>
                        <select id="select-grid" class="pure-input-1" title="網格輔助">
                            <option value="none" selected data-i18n="gridNone">無網格</option>
                            <option value="thirds" data-i18n="gridThirds">九宮格（三分法）</option>
                            <option value="phi" data-i18n="gridPhi">黃金比例（φ）</option>
                            <option value="center" data-i18n="gridCenter">中心十字</option>
                        </select>
                    </div>
                    <label class="checkbox pure-checkbox align-checkbox" style="flex: 1;">
                        <input type="checkbox" id="chk-align" checked>
                        <span data-i18n="alignToggle">對齊</span>
                    </label>
                </div>
            </div>
            <div class="sidebar-section sidebar-section--layout drawer-card--collapsible" id="desktop-layout-tools-card">
                <button type="button" class="drawer-card-title drawer-card-toggle" id="btn-toggle-layout-tools-desktop"
                    aria-expanded="false" aria-controls="desktop-layout-tools-body">
                    <i class="ti ti-layout-grid"></i>
                    <span data-i18n="layoutToolsTitle">排版工具</span>
                    <i class="ti ti-chevron-down layout-toggle-chevron"></i>
                </button>
                <div class="drawer-collapsible-body" id="desktop-layout-tools-body" hidden>
                    <div class="sidebar-row">
                        <button id="btn-layout-grid" class="pure-button" data-i18n="layoutGrid">網格</button>
                    </div>
                    <div class="sidebar-row">
                        <button id="btn-layout-circle" class="pure-button" data-i18n="layoutCircle">圓形</button>
                        <button id="btn-layout-fan" class="pure-button" data-i18n="layoutFan">扇形</button>
                    </div>
                    <div class="sidebar-row">
                        <button id="btn-layout-stack" class="pure-button" data-i18n="layoutStack">Stack</button>
                        <button id="btn-layout-flip3d" class="pure-button" data-i18n="layoutFlip3D">Flip3D</button>
                    </div>
                    <div class="sidebar-row" style="flex-direction: column; gap: 4px; align-items: stretch;">
                        <span style="font-size: 10px; color: var(--text-muted);" data-i18n="layoutSpacing">間距/半徑 (Spacing/Radius)</span>
                        <input type="range" id="slider-layout-spacing" min="50" max="500" value="200" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutScale">整體縮放 (Scale)</span>
                        <input type="range" id="slider-global-scale" min="1" max="100" value="50" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutRotY">水平 3D 翻轉 (RotY)</span>
                        <input type="range" id="slider-3d-roty" min="1" max="100" value="50" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutRotX">垂直 3D 俯仰 (RotX)</span>
                        <input type="range" id="slider-3d-rotx" min="1" max="100" value="50" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutX">水平平移 (X)</span>
                        <input type="range" id="slider-global-x" min="-5000" max="5000" value="0" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutY">垂直平移 (Y)</span>
                        <input type="range" id="slider-global-y" min="-5000" max="5000" value="0" style="width: 100%;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" data-i18n="layoutRotation">整體旋轉 (Rotation)</span>
                        <input type="range" id="slider-global-rotation" min="0" max="360" value="0" style="width: 100%;">
                    </div>
                </div>
            </div>
            <div class="sidebar-section sidebar-section--text">
                <div class="sidebar-row">
                    <input type="text" id="input-text" class="pure-input-2" value="000A" maxlength="4">
                    <input type="text" id="input-text2" class="pure-input-2" value="000000" maxlength="6"
                        placeholder="000000" inputmode="numeric">
                    <select id="select-font" class="pure-input-fontchoese" style="color: #aaa;">
                        <option value="Inter" selected>Inter</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="Pretendard">Pretendard</option>
                    </select>
                    <input type="color" id="input-color" value="#ffffff">
                </div>
            <div class="sidebar-row">
                <div class="qr-input-wrap">
                    <i class="ti ti-qrcode qr-input-icon"></i>
                    <input type="text" id="input-qr-text" placeholder=" 　  QR text (default: cosmo://the-gate)" maxlength="200" />
                </div>
            </div>
        </div>
            <div class="sidebar-section sidebar-section--export">
                <div class="sidebar-title sidebar-title--export">
                    <i class="ti ti-download"></i> <span data-i18n="headerExport">匯出與設定</span>
                </div>
                <div class="sidebar-row">
                    <div class="select-with-icon" style="flex:1;">
                        <i class="ti ti-target"></i>
                        <select id="select-target" class="pure-input-1">
                            <option value="all" selected data-i18n="targetAll">匯出全部</option>
                            <option value="object" data-i18n="targetObj">只有Object</option>
                        </select>
                    </div>
                    <div class="select-with-icon" style="flex:1;">
                        <i class="ti ti-file"></i>
                        <select id="select-format" class="pure-input-1"></select>
                    </div>
                </div>
                <div class="sidebar-row">
                    <button id="export-btn" class="pure-button">
                        <i class="ti ti-download"></i> <span data-i18n="export">匯出</span>
                    </button>
                </div>
                <div class="sidebar-row">
                    <div class="select-with-icon" style="flex:1;">
                        <i class="ti ti-world"></i>
                        <select id="select-lang" class="pure-input-1">
                            <option value="zh-TW" selected>繁體中文</option>
                            <option value="zh-CN">简体中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="th">ไทย</option>
                            <option value="vi">Tiếng Việt</option>
                        </select>
                    </div>
                    <button id="reset-all-btn" class="pure-button">
                        <i class="ti ti-rotate-clockwise"></i> <span data-i18n="resetAll">全部重置</span>
                    </button>
                </div>
                <div class="sidebar-row">
                    <button id="btn-clear-cache-desktop" class="pure-button">
                        <i class="ti ti-database-off"></i> <span data-i18n="clearCacheBtn">清除本地資料（書籤、快取）</span>
                    </button>
                </div>
            </div>
            <div class="sidebar-section sidebar-section--coords" id="coord-monitor-section">
                <div class="sidebar-title">
                    <i class="ti ti-focus-2"></i> <span data-i18n="headerCoords">Object 座標</span>
                </div>
                <div class="coord-input-row">
                    <button id="btn-reset-3d" class="pure-button" style="flex:1;">
                        <i class="ti ti-rotate-clockwise"></i> <span data-i18n="reset3d">重置 3D 角度</span>
                    </button>
                </div>
                <div class="coord-box-row">
                    <div class="coord-box">
                        <div class="coord-label">X:</div>
                        <div class="coord-value" id="coord-x">0</div>
                    </div>
                    <div class="coord-box">
                        <div class="coord-label">Y:</div>
                        <div class="coord-value" id="coord-y">0</div>
                    </div>
                </div>
                <div class="coord-box-row coord-row-2">
                    <div class="coord-box coord-box-r">
                        <div class="coord-label">R:</div>
                        <div class="coord-value" id="coord-r">0°</div>
                    </div>
                    <div class="coord-box">
                        <div class="coord-label">Z:</div>
                        <div class="coord-value" id="coord-z">0</div>
                    </div>
                </div>
                <div class="coord-input-row">
                    <input type="number" id="input-coord-x" class="pure-input-1" placeholder="X" step="1">
                    <input type="number" id="input-coord-y" class="pure-input-1" placeholder="Y" step="1">
                    <input type="number" id="input-coord-z" class="pure-input-1" placeholder="Z %" step="1">
                    <input type="number" id="input-coord-r" class="pure-input-1" placeholder="R °" step="0.1">
                </div>
                <div class="coord-input-row">
                    <input type="number" id="input-coord-rx" class="pure-input-1" placeholder="RX °" step="1" value="0">
                    <input type="number" id="input-coord-ry" class="pure-input-1" placeholder="RY °" step="1" value="0">
                </div>
            </div>
        </div>
        <button id="btn-sidebar-toggle" title="收折選單">
            <i class="ti ti-chevron-left"></i>
        </button>

        <div id="workspace">
            <div id="hint" data-i18n="dropHint">放開以載入背景圖</div>
            <div id="canvas-wrap">
                <canvas id="bg-canvas" width="1083" height="1673"></canvas>
                <canvas id="ui-canvas" width="1083" height="1673"></canvas>
			<div id="canvas-empty-hint" class="canvas-empty-hint" aria-hidden="true">
				<i class="ti ti-file-upload"></i>
			</div>
            </div>
        </div>
    </div>
    <input type="file" id="input-bg"
        accept="image/*,video/mp4,video/quicktime,video/x-matroska,video/mp2t,video/webm,video/x-m4v,.mkv,.ts,.mov,.m4v"
        style="display: none !important;">
    <div id="toast"></div>
    <div id="export-log" class="export-log" aria-live="polite">
        <img id="export-log-spinner" alt="" width="16" height="16"
            style="display:none;vertical-align:middle;margin-right:6px;">
        <span id="export-log-text"></span>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
